<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C++ Scientific Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --btn: #334155;
      --btn-hover: #475569;
      --accent: #38bdf8;
      --op: #0284c7;
      --eq: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
    }
    .calc {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .mode-toggle {
      background: var(--btn);
      color: var(--accent);
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      font-weight: 600;
    }
    .screen {
      background: #0b1120;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
      text-align: right;
      min-height: 86px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .expr {
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
      word-break: break-all;
    }
    .display {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      overflow-x: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }
    button.key {
      background: var(--btn);
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 0.85rem 0.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
    }
    button.key:hover { background: var(--btn-hover); }
    button.op { background: var(--op); }
    button.op:hover { background: #0369a1; }
    button.eq { background: var(--eq); color: #052e16; }
    button.eq:hover { background: #059669; color: #fff; }
    button.clr { background: var(--danger); }
    button.clr:hover { background: #dc2626; }
    .span-2 { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calc">
    <div class="header">
      <span>Engine: <strong>C++ (./calc)</strong></span>
      <button id="angleMode" class="mode-toggle" title="Toggle Degrees / Radians">DEG</button>
    </div>

    <div class="screen">
      <div id="expr" class="expr"></div>
      <div id="display" class="display">0</div>
    </div>

    <div class="grid">
      <button class="key" data-unary="sin">sin</button>
      <button class="key" data-unary="cos">cos</button>
      <button class="key" data-unary="tan">tan</button>
      <button class="key" data-unary="ln">ln</button>
      <button class="key" data-unary="log10">log10</button>

      <button class="key" data-unary="sqrt">√x</button>
      <button class="key" data-unary="exp">eˣ</button>
      <button class="key" data-binary="pow">xʸ</button>
      <button class="key clr" id="clear">AC</button>
      <button class="key" id="backspace">⌫</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-binary="div">÷</button>
      <button class="key" id="negate">±</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-binary="mul">×</button>
      <button class="key" data-const="3.141592653589793">π</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-binary="sub">−</button>
      <button class="key eq" id="equals" style="grid-row: span 2;">=</button>

      <button class="key span-2" data-num="0">0</button>
      <button class="key" data-num=".">.</button>
      <button class="key op" data-binary="add">+</button>
    </div>
  </div>

  <script>
    const displayEl = document.getElementById("display");
    const exprEl = document.getElementById("expr");
    const modeBtn = document.getElementById("angleMode");

    let current = "0";
    let firstOperand = null;
    let pendingOp = null;
    let resetNext = false;
    let angleMode = "DEG"; // DEG or RAD

    function updateDisplay() {
      displayEl.textContent = current;
    }

    async function callCalc(op, a, b = null) {
      const res = await fetch("/api/calc", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ op, a: String(a), b: b !== null ? String(b) : null })
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || "Calculation error");
      }
      return data.result;
    }

    modeBtn.addEventListener("click", () => {
      angleMode = angleMode === "DEG" ? "RAD" : "DEG";
      modeBtn.textContent = angleMode;
    });

    document.querySelectorAll("[data-num]").forEach(btn => {
      btn.addEventListener("click", () => {
        const val = btn.dataset.num;
        if (resetNext || current === "Error") {
          current = val === "." ? "0." : val;
          resetNext = false;
        } else if (val === "." && current.includes(".")) {
          return;
        } else {
          current = current === "0" && val !== "." ? val : current + val;
        }
        updateDisplay();
      });
    });

    document.querySelectorAll("[data-const]").forEach(btn => {
      btn.addEventListener("click", () => {
        current = btn.dataset.const;
        resetNext = true;
        updateDisplay();
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      current = "0";
      firstOperand = null;
      pendingOp = null;
      resetNext = false;
      exprEl.textContent = "";
      updateDisplay();
    });

    document.getElementById("backspace").addEventListener("click", () => {
      if (resetNext || current === "Error") return;
      current = current.length > 1 ? current.slice(0, -1) : "0";
      updateDisplay();
    });

    document.getElementById("negate").addEventListener("click", () => {
      if (current === "0" || current === "Error") return;
      current = current.startsWith("-") ? current.slice(1) : "-" + current;
      updateDisplay();
    });

    document.querySelectorAll("[data-unary]").forEach(btn => {
      btn.addEventListener("click", async () => {
        let op = btn.dataset.unary;
        if (op === "sin" || op === "cos" || op === "tan") {
          op = `${op}_${angleMode.toLowerCase()}`;
        }
        try {
          exprEl.textContent = `${op}(${current})`;
          current = await callCalc(op, current);
          resetNext = true;
        } catch (err) {
          current = "Error";
          exprEl.textContent = err.message;
        }
        updateDisplay();
      });
    });

    document.querySelectorAll("[data-binary]").forEach(btn => {
      btn.addEventListener("click", () => {
        firstOperand = current;
        pendingOp = btn.dataset.binary;
        exprEl.textContent = `${firstOperand} ${btn.textContent}`;
        resetNext = true;
      });
    });

    document.getElementById("equals").addEventListener("click", async () => {
      if (!pendingOp || firstOperand === null) return;
      try {
        exprEl.textContent = `${firstOperand} ${pendingOp} ${current} =`;
        current = await callCalc(pendingOp, firstOperand, current);
        firstOperand = null;
        pendingOp = null;
        resetNext = true;
      } catch (err) {
        current = "Error";
        exprEl.textContent = err.message;
      }
      updateDisplay();
    });
  </script>
</body>
</html>
